<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2
    </title>
</head>
<body>
    <label for="numero">Ingresa un número entero:</label>
  <input type="number" id="numero">
  <button onclick="calcularCubo()">Calcular Cubo</button>

  <script>
    function calcularCubo() {
      const valor = parseInt(document.getElementById('numero').value);
      if (isNaN(valor)) {
        alert("Por favor, ingresa un número válido.");
      } else {
        const cubo = Math.pow(valor, 3);
        alert("El cubo de " + valor + " es: " + cubo);
      }
    }
  </script>
    
</body>
</html>
