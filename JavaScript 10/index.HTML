<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensaje al Cargar</title>

    <script>
        function mostrarMensaje() {
            alert("Bienvenido. La página se ha cargado correctamente.");
        }
    </script>
</head>

<body onload="mostrarMensaje()">
    <h2>Página de Ejemplo</h2>
    <p>El mensaje aparece automáticamente al cargar la página.</p>
</body>
</html>
